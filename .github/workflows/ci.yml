name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  checks:
    name: Pruebas y build
    runs-on: ubuntu-latest
    env:
      # Valores de relleno: el build solo verifica que existan
      PUBLIC_SUPABASE_URL: https://ejemplo.supabase.co
      PUBLIC_SUPABASE_ANON_KEY: ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Pruebas
        run: npm test
      - name: Revisar componentes Svelte
        run: npm run check
      - name: Build
        run: npm run build
